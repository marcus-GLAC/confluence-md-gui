[project]
name = "confluence-md-gui"
version = "0.4.0"
description = "Giao diện web local để export Confluence ra Markdown (kèm ảnh) và đẩy lên GitHub."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluence-markdown-exporter==5.5.0",
    "markdown>=3.7,<4",
    "keyring>=25,<26",
]

[project.scripts]
cme-gui = "confluence_md_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_md_gui"]
